name: Linux desktop

on:
  push:
    paths: ['desktop/**', '.github/workflows/linux.yml', 'gradle/wrapper/**', 'gradlew']
  pull_request:
    paths: ['desktop/**', '.github/workflows/linux.yml', 'gradle/wrapper/**', 'gradlew']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package Linux desktop
        run: bash gradlew -p desktop check installDist distTar
      - name: Desktop window smoke test
        run: xvfb-run -a bash gradlew -p desktop guiSmoke
      - name: Package Debian installer
        run: bash desktop/package-deb.sh --skip-build --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-linux-desktop
          path: |
            desktop/build/distributions/*.tar
            desktop/build/distributions/*.deb
          if-no-files-found: error
